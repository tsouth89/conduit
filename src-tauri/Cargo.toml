[package]
name = "conduit"
version = "1.18.0"
description = "Local MCP gateway: manage all your MCP servers in one place, set up once and shared by every AI client, with ~90% fewer tokens per request"
authors = ["South Forge AI"]
edition = "2021"
default-run = "conduit"

[[bin]]
name = "conduit"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "toolport-gtk"
path = "src/bin/toolport-gtk.rs"
required-features = ["gtk-desktop"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-window-state",
]
# Test-only hooks (data-dir override, fixture definition constructors). Never
# enable in a shipped binary. `cargo test --release --bin toolport-gateway`
# needs it because the library is compiled without `cfg(test)` when linked
# into the binary; docker-publish rebuilds without this feature before upload.
test-support = []
# Additive Linux-native shell. This is deliberately not a default feature: the
# current Tauri app remains the shipping desktop while the GTK shell reaches
# behavioral parity.
gtk-desktop = ["dep:gtk", "dep:adw", "dep:image", "dep:ksni"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49", default-features = false }
json5 = "0.4"
# CST rewriter so install/write can keep comments + trailing commas in JSONC
# client configs (VS Code mcp.json, Zed settings, kilo.jsonc, …). Issue #555.
jsonc-parser = { version = "0.33", features = ["cst"] }
serde_yaml = "0.9"
toml = "0.8"
# DocumentMut rewriter so Codex/Grok config.toml comments survive Connect,
# launch-time repoint, and uninstall (SBS-884). Matches the JSONC CST contract.
toml_edit = "0.22"
dirs = "5"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
# HMAC-SHA256 for the approval broker's challenge-response (SBS-867); already in
# the tree transitively, promoted to a direct dep.
hmac = "0.12"
subtle = "2.6"
# Pure-Rust JS engine for server-side "code mode" orchestration (SOU-184): run one
# agent script that calls many downstream tools, so an N-step task costs one round-trip
# and the intermediate results never enter model context. Chosen over QuickJS to keep the
# build free of a C toolchain / FFI. `boa_gc` supplies the Trace impls host state needs.
boa_engine = "0.21"
boa_gc = "0.21"
base64 = "0.22"
regex = "1"
getrandom = "0.2"
# OS advisory file locking (flock / LockFileEx) for the cross-process registry write
# lock, so the app, the gateway binary, and the team-sync worker can't revert each
# other's registry.json edits. Auto-released by the OS if a holder crashes.
fs2 = "0.4"
chacha20poly1305 = "0.10"
urlencoding = "2"
# file:// URI -> path decoding for the ${ROOT} cwd token (issue #239); already in
# the tree transitively, promoted to a direct dep for url::Url::to_file_path.
url = "2"
# Minimal synchronous HTTP server for the gateway's native HTTP/OpenAPI mode
# (first-class Open WebUI and any OpenAPI tool client, no external bridge).
tiny_http = "0.12"
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }

# OS keychain, with the native backend per platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4", "gtk_v4_10"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
ksni = { version = "0.3.6", features = ["blocking"], optional = true }

# Debug builds carried full debug info, which is most of what makes `target/`
# enormous: it reached 21G on a maintainer machine, and a contributor reported
# Codespaces' 32G disk filling before a clean build finished (#728). Line tables
# keep backtraces with file and line numbers, which is what a failing test
# actually needs, and drop the variable-level DWARF that nothing in this
# project's workflow reads. `RUSTFLAGS=-Cdebuginfo=2` restores the rest for a
# real debugger session.
[profile.dev]
debug = "line-tables-only"

# Same for the profile `cargo test` builds under.
[profile.test]
debug = "line-tables-only"
